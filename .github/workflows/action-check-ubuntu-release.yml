name: Check for new Ubuntu LTS
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: Check for new Ubuntu LTS
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find newest released Ubuntu LTS
        id: lts
        run: |
          # version,codename,series,created,release,eol,eol-server,eol-esm
          curl -fsSL https://salsa.debian.org/debian/distro-info-data/-/raw/main/ubuntu.csv -o ubuntu.csv
          today="$(date -u +%F)"
          newest="$(awk -F, -v today="${today}" '$1 ~ /LTS/ && $5 != "" && $5 <= today { split($1, v, " "); print v[1] }' ubuntu.csv | sort -V | tail -n 1)"
          codename="$(awk -F, -v ver="${newest} LTS" '$1 == ver { print $2 }' ubuntu.csv)"
          rm -f ubuntu.csv
          echo "Newest released LTS: ${newest} (${codename})"
          if jq -e --arg v "${newest}" 'any(.[]; .distro == "ubuntu" and .version == $v)' versions.json >/dev/null; then
            echo "Already tracked in versions.json"
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif ! docker manifest inspect "ubuntu:${newest}" >/dev/null 2>&1; then
            echo "ubuntu:${newest} not yet on Docker Hub"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "new=true"
              echo "version=${newest}"
              echo "codename=${codename}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Test build
        if: steps.lts.outputs.new == 'true'
        run: |
          docker build --build-arg DISTRO=ubuntu --build-arg DISTRO_VERSION=${{ steps.lts.outputs.version }} -t steamcmd:test .
          docker run --rm steamcmd:test +login anonymous +app_info_update 1 +quit

      - name: Add version and make it latest
        if: steps.lts.outputs.new == 'true'
        run: |
          jq --arg v "${{ steps.lts.outputs.version }}" \
            '[{distro: "ubuntu", version: $v, latest: true}] + map(.latest = false)' \
            versions.json > versions.json.tmp
          mv versions.json.tmp versions.json

      - name: Create pull request
        if: steps.lts.outputs.new == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ubuntu-${{ steps.lts.outputs.version }}
          commit-message: "feat: add Ubuntu ${{ steps.lts.outputs.version }} LTS and make it latest"
          title: "feat: add Ubuntu ${{ steps.lts.outputs.version }} LTS (${{ steps.lts.outputs.codename }}) and make it latest"
          body: |
            Ubuntu ${{ steps.lts.outputs.version }} LTS (${{ steps.lts.outputs.codename }}) has been released and `ubuntu:${{ steps.lts.outputs.version }}` is on Docker Hub.

            The image built and passed the SteamCMD smoke test (`+login anonymous +app_info_update 1 +quit`) in this workflow.

            This PR adds it to `versions.json` and moves the `latest` / `ubuntu` tags to it.

            Before merging:
            - [ ] Update the Tags table in `README.md`
            - [ ] Change the `DISTRO_VERSION` default in `Dockerfile`
            - [ ] Decide whether the oldest release should be dropped
